<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Mesa de Siniestros SPL-9</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: una sola página con dos modos. #proyector = escenas a pantalla completa manejadas por el grupo; sin hash = el celular de cada compañero (preguntas + calculadora). Motivo visual: la "faja de vuelo" (flight strip) de la torre de control. */
:root {
  --bg: #F2F5F7;
  --surface: #FFFFFF;
  --ink: #13202B;
  --muted: #566878;
  --line: #D3DCE3;
  --accent: #D9821A;
  --accent-ink: #8C4D05;
  --accent-soft: #FBEBD5;
  --ok: #1E7A4C;
  --ok-soft: #DDF1E6;
  --bad: #B03A2A;
  --bad-soft: #F7E0DB;
  --night: #0E1922;
  --night-ink: #E8EEF2;
  --night-muted: #9AACBA;
  --qr-bg: #FFFFFF;
  --qr-fg: #000000;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D141B; --surface: #16212B; --ink: #E5ECF1; --muted: #93A5B4; --line: #2A3947;
    --accent: #F0A040; --accent-ink: #F3AE57; --accent-soft: #3A2A15;
    --ok: #4CC38A; --ok-soft: #173327; --bad: #EF7B68; --bad-soft: #3A1E1A;
    --night: #070C11; --night-ink: #E8EEF2; --night-muted: #93A5B4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D141B; --surface: #16212B; --ink: #E5ECF1; --muted: #93A5B4; --line: #2A3947;
  --accent: #F0A040; --accent-ink: #F3AE57; --accent-soft: #3A2A15;
  --ok: #4CC38A; --ok-soft: #173327; --bad: #EF7B68; --bad-soft: #3A1E1A;
  --night: #070C11; --night-ink: #E8EEF2; --night-muted: #93A5B4;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; line-height: 1.05; text-wrap: balance; margin: 0; letter-spacing: 0.005em; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--f-mono); font-size: 0.78em; text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent-ink); }
.muted { color: var(--muted); }
a { color: var(--accent-ink); }

/* ---------- Faja de vuelo (motivo) ---------- */
.strip { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 0 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; }
.strip .cs { font-family: var(--f-display); font-size: 1.6em; font-weight: 700; }
.strip .reg { font-family: var(--f-mono); color: var(--muted); font-size: 0.9em; }
.strip .t { font-family: var(--f-mono); font-size: 1.1em; text-align: right; }
.strip.hot { background: var(--accent-soft); border-color: var(--accent); }

/* ---------- Modo celular ---------- */
#movil { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 40px; display: grid; gap: 18px; }
.m-head { display: grid; gap: 10px; }
.m-head h1 { font-size: 2.3em; }
.m-head .lead { color: var(--muted); }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.tabs button { border: 0; background: transparent; border-radius: 999px; padding: 10px; font-weight: 600; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.chips { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; }
.chip { aspect-ratio: 1; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; font-family: var(--f-mono); font-size: 0.95em; display: grid; place-items: center; padding: 0; }
.chip.cur { border-color: var(--ink); border-width: 2px; }
.chip.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.chip.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 14px; min-width: 0; }
.ctx { font-size: 0.95em; color: var(--muted); border-left: 3px solid var(--line); padding-left: 10px; }
.q-title { font-family: var(--f-body); font-weight: 600; font-size: 1.15em; line-height: 1.35; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 2em 1fr; gap: 10px; align-items: center; text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-height: 52px; }
.opt .k { font-family: var(--f-mono); width: 2em; height: 2em; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); }
.opt[disabled] { cursor: default; }
.opt.is-ok { background: var(--ok-soft); border-color: var(--ok); }
.opt.is-ok .k { background: var(--ok); color: var(--surface); border-color: var(--ok); }
.opt.is-bad { background: var(--bad-soft); border-color: var(--bad); }
.opt.is-bad .k { background: var(--bad); color: var(--surface); border-color: var(--bad); }
.fb { display: grid; gap: 6px; border-radius: 8px; padding: 12px; }
.fb.ok { background: var(--ok-soft); }
.fb.bad { background: var(--bad-soft); }
.fb strong { font-family: var(--f-display); font-size: 1.3em; letter-spacing: 0.02em; }
.fb.ok strong { color: var(--ok); }
.fb.bad strong { color: var(--bad); }
.src { font-family: var(--f-mono); font-size: 0.8em; color: var(--muted); }
.row-btns { display: flex; gap: 8px; justify-content: space-between; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 16px; font-weight: 600; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn[disabled] { opacity: 0.4; cursor: default; }
.score { font-family: var(--f-mono); font-size: 0.9em; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.calc label { display: grid; gap: 6px; font-weight: 600; }
.calc input { font: inherit; font-family: var(--f-mono); font-size: 1.2em; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); width: 100%; box-sizing: border-box; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.presets button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 12px; font-size: 0.9em; }
.result { display: grid; gap: 4px; background: var(--accent-soft); border-radius: 8px; padding: 12px; }
.result .big { font-family: var(--f-display); font-size: 2.4em; line-height: 1; color: var(--accent-ink); }
.result .steps { font-family: var(--f-mono); font-size: 0.85em; color: var(--ink); overflow-wrap: anywhere; }
.foot { font-size: 0.85em; color: var(--muted); display: grid; gap: 6px; }

/* ---------- Modo proyector ---------- */
#proyector { height: 100%; display: grid; grid-template-rows: 1fr auto; }
#stage { min-height: 0; overflow: auto; padding-left: max(4vw, env(safe-area-inset-left, 0px)); padding-right: max(4vw, env(safe-area-inset-right, 0px)); padding-block: 3.5vh 2vh; display: grid; align-content: center; font-size: clamp(16px, 1.55vw, 30px); }
#stage.dark { background: var(--night); color: var(--night-ink); }
.scene { display: grid; gap: 1.2em; max-width: 1500px; width: 100%; margin: 0 auto; animation: in 0.35s ease-out; }
@keyframes in { from { opacity: 0.4; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .scene { animation: none; } .timer i { transition: none !important; } }
.scene h2 { font-size: 3.4em; }
.scene .lead { font-size: 1.15em; max-width: 52ch; color: var(--muted); }
.cover { grid-template-columns: 1.4fr 1fr; align-items: center; gap: 3em; }
.cover h1 { font-size: 5.2em; }
.cover .sub { font-size: 1.3em; color: var(--muted); max-width: 30ch; }
.qr-box { background: var(--qr-bg); border-radius: 14px; padding: 1em; display: grid; gap: 0.6em; justify-items: center; color: #13202B; }
.qr-box svg, .qr-box img { width: 100%; max-width: 13em; height: auto; display: block; }
.qr-box .u { font-family: var(--f-mono); font-size: 0.7em; text-align: center; overflow-wrap: anywhere; }
.strips { display: grid; gap: 0.5em; max-width: 34em; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 2em; align-items: start; }
.formulario { width: 100%; border-collapse: collapse; background: var(--surface); font-size: 0.9em; }
.formulario th, .formulario td { border: 1px solid var(--line); padding: 0.45em 0.6em; text-align: left; vertical-align: top; }
.formulario th { font-family: var(--f-mono); font-size: 0.75em; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 500; }
.formulario td.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.tl { display: grid; gap: 0.55em; max-width: 60em; }
.tl div { display: grid; grid-template-columns: 4.2em 1fr; gap: 1em; align-items: baseline; }
.tl .h { font-family: var(--f-mono); font-size: 1.05em; color: var(--accent-ink); }
.tl .warn .h, .tl .warn span { color: var(--bad); font-weight: 600; }
.radio { font-family: var(--f-mono); }
.q-scene .num { font-family: var(--f-display); font-size: 1.4em; color: var(--accent-ink); letter-spacing: 0.04em; }
.q-scene h2 { font-family: var(--f-body); font-weight: 600; font-size: 2em; line-height: 1.25; max-width: 38ch; }
.q-scene .opts { grid-template-columns: 1fr 1fr; gap: 0.6em; }
.q-scene .opt { font-size: 1em; padding: 0.7em 0.9em; min-height: 0; cursor: default; }
.q-scene .opt .k { width: 1.8em; height: 1.8em; }
.timer { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.timer i { display: block; height: 100%; background: var(--accent); width: 100%; transition: width 1s linear; }
.reveal { display: grid; gap: 0.4em; background: var(--ok-soft); border-radius: 10px; padding: 0.8em 1em; }
.reveal strong { font-family: var(--f-display); font-size: 1.4em; color: var(--ok); }
.impact { text-align: left; }
.impact .when { font-family: var(--f-mono); color: var(--night-muted); font-size: 1.1em; }
.impact .figs { display: flex; gap: 4em; flex-wrap: wrap; }
.impact .fig b { display: block; font-family: var(--f-display); font-size: 7em; line-height: 0.95; color: var(--night-ink); }
.impact .fig span { color: var(--night-muted); font-size: 1.1em; }
.impact blockquote { margin: 0; max-width: 60ch; color: var(--night-ink); font-size: 1.05em; border-left: 3px solid var(--accent); padding-left: 1em; }
.impact .silence { font-family: var(--f-mono); color: var(--accent); letter-spacing: 0.1em; text-transform: uppercase; font-size: 0.85em; }
.tramos { width: 100%; border-collapse: collapse; font-size: 0.95em; background: var(--surface); }
.tramos td, .tramos th { border-bottom: 1px solid var(--line); padding: 0.45em 0.6em; text-align: left; }
.tramos th { font-family: var(--f-mono); font-size: 0.72em; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 500; }
.tramos td { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.tramos tr.here td { background: var(--accent-soft); font-weight: 600; }
.mini { display: grid; gap: 0.6em; }
.mini .k { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0.8em 1em; }
.mini .k b { font-family: var(--f-display); font-size: 1.8em; color: var(--accent-ink); }
.board { width: 100%; border-collapse: collapse; background: var(--surface); }
.board td, .board th { border-bottom: 1px solid var(--line); padding: 0.55em 0.7em; text-align: left; }
.board th { font-family: var(--f-mono); font-size: 0.72em; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 500; }
.pill { display: inline-block; font-family: var(--f-mono); font-size: 0.8em; padding: 0.15em 0.6em; border-radius: 99px; font-weight: 500; }
.pill.si { background: var(--ok-soft); color: var(--ok); }
.pill.no { background: var(--bad-soft); color: var(--bad); }
.pill.nd { background: var(--accent-soft); color: var(--accent-ink); }
.bar { display: flex; align-items: center; gap: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); background: var(--surface); flex-wrap: wrap; }
.bar .grow { flex: 1; }
.bar .pos { font-family: var(--f-mono); color: var(--muted); font-size: 0.9em; }
.bar .hint { font-size: 0.8em; color: var(--muted); }
.progress { height: 4px; background: var(--line); }
.progress i { display: block; height: 100%; background: var(--accent); transition: width 0.3s; }

@media (max-width: 820px) {
  .cover, .two, .q-scene .opts { grid-template-columns: 1fr; }
  .cover h1 { font-size: 3.4em; }
  .impact .fig b { font-size: 4.5em; }
}
@media (max-width: 420px) {
  .chips { grid-template-columns: repeat(5, minmax(0, 1fr)); }
}
</style>

  var Q = [

  var TRAMOS = [
    { n: 1, rango: "Hasta 1.000 kg", base: 2000, desde: 0, x: 0 },
    { n: 2, rango: "1.000 a 6.000 kg", base: 2000, desde: 1000, x: 1.5 },
    { n: 3, rango: "6.000 a 20.000 kg", base: 10400, desde: 6000, x: 1 },
    { n: 4, rango: "20.000 a 50.000 kg", base: 25000, desde: 20000, x: 0.5 },
    { n: 5, rango: "Más de 50.000 kg", base: 43600, desde: 50000, x: 0.37 }

  function art160(kg) {
    var t = kg <= 1000 ? TRAMOS[0] : kg <= 6000 ? TRAMOS[1] : kg <= 20000 ? TRAMOS[2] : kg <= 50000 ? TRAMOS[3] : TRAMOS[4];
    var exc = Math.max(0, kg - t.desde);
    var extra = t.x ? Math.round(exc * t.x * 100) / 100 : 0;
    return { t: t, exc: exc, extra: extra, total: Math.round((t.base + extra) * 100) / 100 };
  }

  window.addEventListener("hashchange", route);
