<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Siniestro Austral SPL-9 · TP Aeronavegación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Dos modos en una sola página:
   #proyector  -> presentación del grupo (5 bloques de 3 pantallas + juego de cierre)
   sin hash    -> celular de cada compañero (video, preguntas y calculadora)
   Paleta: naranja Austral + azul noche de montaña. */
:root {
  --bg: #F2F5F7; --surface: #FFFFFF; --ink: #13202B; --muted: #566878; --line: #D3DCE3;
  --accent: #E0701B; --accent-ink: #9A4708; --accent-soft: #FCE6D2;
  --ok: #1E7A4C; --ok-soft: #DDF1E6; --bad: #B03A2A; --bad-soft: #F7E0DB;
  --f-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --radius: 10px;
  /* proyector */
  --n0: #08111B; --n1: #0F1E2E; --n2: #172C42; --n3: #24405E;
  --nink: #EEF3F7; --nmuted: #A3B6C7; --nline: #2C4560;
  --or: #F28A2E; --or2: #FFB25B; --red: #FF6B5A; --green: #5FD39A; --sky: #6FB7FF;
  --b1: #F28A2E; --b2: #6FB7FF; --b3: #C79BFF; --b4: #5FD39A; --b5: #FFD15C;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0D141B; --surface: #16212B; --ink: #E5ECF1; --muted: #93A5B4; --line: #2A3947;
    --accent: #F28A2E; --accent-ink: #FFB25B; --accent-soft: #3A2615;
    --ok: #4CC38A; --ok-soft: #173327; --bad: #EF7B68; --bad-soft: #3A1E1A; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; }
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; line-height: 1.04; margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--or); outline-offset: 2px; }
.eyebrow { font-family: var(--f-mono); font-size: .78em; text-transform: uppercase; letter-spacing: .12em; color: var(--accent-ink); }
.muted { color: var(--muted); }
a { color: var(--accent-ink); }

/* ================= CELULAR ================= */
#movil { max-width: 640px; margin: 0 auto; padding: 18px max(16px, env(safe-area-inset-left)) 40px; display: grid; gap: 18px; }
.m-head { display: grid; gap: 10px; }
.m-head h1 { font-size: 2.3em; }
.m-strip { display: grid; grid-template-columns: auto 1fr auto; gap: 0 12px; align-items: center; background: linear-gradient(90deg, var(--accent), #C2410C); color: #fff; border-radius: 8px; padding: 10px 14px; }
.m-strip b { font-family: var(--f-display); font-size: 1.6em; }
.m-strip span { font-family: var(--f-mono); font-size: .85em; opacity: .9; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.tabs button { border: 0; background: transparent; border-radius: 999px; padding: 10px 4px; font-weight: 600; }
.tabs button[aria-selected="true"] { background: var(--accent); color: #fff; }
.chips { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; }
.chip { aspect-ratio: 1; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; font-family: var(--f-mono); display: grid; place-items: center; padding: 0; }
.chip.cur { border-color: var(--accent); border-width: 2px; }
.chip.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.chip.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 14px; min-width: 0; }
.ctx { font-size: .95em; color: var(--muted); border-left: 3px solid var(--accent); padding-left: 10px; }
.q-title { font-weight: 600; font-size: 1.15em; line-height: 1.35; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 2em 1fr; gap: 10px; align-items: center; text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-height: 52px; }
.opt .k { font-family: var(--f-mono); width: 2em; height: 2em; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); }
.opt[disabled] { cursor: default; }
.opt.is-ok { background: var(--ok-soft); border-color: var(--ok); }
.opt.is-ok .k { background: var(--ok); color: #fff; border-color: var(--ok); }
.opt.is-bad { background: var(--bad-soft); border-color: var(--bad); }
.opt.is-bad .k { background: var(--bad); color: #fff; border-color: var(--bad); }
.fb { display: grid; gap: 6px; border-radius: 8px; padding: 12px; }
.fb.ok { background: var(--ok-soft); } .fb.bad { background: var(--bad-soft); }
.fb strong { font-family: var(--f-display); font-size: 1.3em; }
.fb.ok strong { color: var(--ok); } .fb.bad strong { color: var(--bad); }
.src { font-family: var(--f-mono); font-size: .8em; color: var(--muted); }
.row-btns { display: flex; gap: 8px; justify-content: space-between; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 16px; font-weight: 600; }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn[disabled] { opacity: .4; cursor: default; }
.score { font-family: var(--f-mono); font-size: .9em; color: var(--muted); display: flex; justify-content: space-between; }
.calc label { display: grid; gap: 6px; font-weight: 600; }
.calc input { font: inherit; font-family: var(--f-mono); font-size: 1.2em; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); width: 100%; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.presets button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 12px; font-size: .9em; }
.result { display: grid; gap: 4px; background: var(--accent-soft); border-radius: 8px; padding: 12px; }
.result .big { font-family: var(--f-display); font-size: 2.4em; line-height: 1; color: var(--accent-ink); }
.result .steps { font-family: var(--f-mono); font-size: .85em; overflow-wrap: anywhere; }
.foot { font-size: .85em; color: var(--muted); display: grid; gap: 6px; }
.ig-wrap { display: grid; justify-items: center; gap: 10px; }
.ig-wrap .instagram-media { margin: 0 auto !important; min-width: 0 !important; width: 100% !important; max-width: 400px !important; }
.ig-fallback { font-size: .9em; }

/* ================= PROYECTOR ================= */
#proyector { height: 100%; display: grid; grid-template-rows: auto 1fr auto; background: var(--n0); color: var(--nink); }
#topbar { display: flex; align-items: center; gap: 14px; padding: 10px max(3vw, 16px); background: var(--n1); border-bottom: 1px solid var(--nline); font-size: clamp(12px, .95vw, 18px); }
#topbar .who { display: flex; align-items: center; gap: 10px; font-weight: 600; }
#topbar .dot { width: .9em; height: .9em; border-radius: 50%; background: var(--bc, var(--or)); box-shadow: 0 0 0 4px color-mix(in srgb, var(--bc, var(--or)) 25%, transparent); }
#topbar .blk { font-family: var(--f-mono); color: var(--nmuted); text-transform: uppercase; letter-spacing: .1em; font-size: .85em; }
#topbar .grow { flex: 1; }
.jump { display: flex; gap: 6px; }
.jump button { border: 1px solid var(--nline); background: transparent; color: var(--nmuted); border-radius: 999px; padding: .25em .8em; font-size: .85em; }
.jump button.on { background: var(--bc); color: var(--n0); border-color: transparent; font-weight: 700; }
#stage { position: relative; min-height: 0; overflow: auto; display: grid; align-content: center; padding: 3vh max(4vw, 20px); font-size: clamp(14px, 1.32vw, 28px); isolation: isolate; }
#stage::before { content: ""; position: absolute; inset: 0; z-index: -2; background: radial-gradient(ellipse at 80% 0%, var(--n3) 0%, transparent 55%), radial-gradient(ellipse at 0% 100%, #2A1A0E 0%, transparent 50%), var(--n0); }
.bgimg { position: absolute; inset: 0; z-index: -1; background-size: cover; background-position: center; opacity: .35; }
.bgimg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--n0) 25%, rgba(8,17,27,.55) 70%, rgba(8,17,27,.25)); }
.scene { display: grid; gap: 1.1em; max-width: 1500px; width: 100%; margin: 0 auto; animation: in .4s ease-out; }
@keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .scene, .race i { animation: none !important; } }
.kicker { font-family: var(--f-mono); text-transform: uppercase; letter-spacing: .14em; font-size: .78em; color: var(--bc, var(--or)); }
.scene h2 { font-size: 3.3em; color: #fff; }
.scene h2 em { font-style: normal; color: var(--or); }
.lead { font-size: 1.15em; max-width: 56ch; color: var(--nmuted); }
.credit { font-family: var(--f-mono); font-size: .62em; color: var(--nmuted); opacity: .85; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.6em; align-items: start; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1em; }
.grid5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: .8em; }
.tile { background: color-mix(in srgb, var(--n2) 85%, transparent); border: 1px solid var(--nline); border-radius: 14px; padding: 1em 1.1em; display: grid; gap: .35em; align-content: start; backdrop-filter: blur(4px); }
.tile .t { font-family: var(--f-display); font-size: 1.45em; font-weight: 700; color: #fff; line-height: 1.1; }
.tile p { color: var(--nmuted); font-size: .92em; }
.tile.or { border-color: var(--or); background: color-mix(in srgb, var(--or) 14%, var(--n1)); }
.tile.red { border-color: var(--red); background: color-mix(in srgb, var(--red) 14%, var(--n1)); }
.tile.green { border-color: var(--green); background: color-mix(in srgb, var(--green) 12%, var(--n1)); }
.tile .ic { font-size: 1.6em; line-height: 1; }
.big-num { display: flex; gap: 3.5em; flex-wrap: wrap; }
.big-num div b { display: block; font-family: var(--f-display); font-size: 6.4em; line-height: .95; color: #fff; }
.big-num div b.or { color: var(--or); } .big-num div b.gr { color: var(--green); }
.big-num div span { color: var(--nmuted); }
.quote { margin: 0; border-left: 4px solid var(--or); padding: .4em 0 .4em 1em; font-size: 1.05em; color: var(--nink); max-width: 64ch; }
.quote small { display: block; color: var(--nmuted); font-family: var(--f-mono); font-size: .7em; margin-top: .4em; }
/* carrera de vuelos */
.race { display: grid; gap: .8em; }
.lane { display: grid; grid-template-columns: 6em 1fr 5em; gap: 1em; align-items: center; }
.lane .cs { font-family: var(--f-display); font-size: 1.6em; font-weight: 700; }
.lane .tm { font-family: var(--f-mono); color: var(--nmuted); text-align: right; }
.track { position: relative; height: 2.6em; border-radius: 999px; background: var(--n2); border: 1px dashed var(--nline); }
.track i { position: absolute; top: 50%; left: 0; transform: translate(-10%, -50%); font-style: normal; font-size: 1.6em; animation: fly 3.2s cubic-bezier(.3,.6,.4,1) forwards; }
.lane.hot .track { border-color: var(--or); background: color-mix(in srgb, var(--or) 18%, var(--n2)); }
.lane.hot .cs { color: var(--or); }
@keyframes fly { to { left: var(--to); } }
.track .lbl { position: absolute; left: 3.2em; top: 50%; transform: translateY(-50%); font-family: var(--f-mono); font-size: .7em; color: var(--nmuted); }
/* cronología */
.tl { display: grid; gap: .25em; position: relative; }
.tl .r { display: grid; grid-template-columns: 7.5em 1.4em 1fr; gap: .8em; align-items: start; padding: .35em 0; }
.tl .h { font-family: var(--f-mono); color: var(--or2); text-align: right; }
.tl .m { width: .9em; height: .9em; border-radius: 50%; background: var(--sky); margin-top: .35em; justify-self: center; box-shadow: 0 0 0 4px rgba(111,183,255,.18); }
.tl .r.hot .m { background: var(--red); box-shadow: 0 0 0 5px rgba(255,107,90,.25); }
.tl .r.hot .h, .tl .r.hot span:last-child { color: var(--red); font-weight: 600; }
.tl .r.good .m { background: var(--green); }
/* tablas */
.tbl { width: 100%; border-collapse: collapse; background: color-mix(in srgb, var(--n1) 90%, transparent); border-radius: 12px; overflow: hidden; font-size: .88em; }
.tbl th, .tbl td { padding: .55em .7em; border-bottom: 1px solid var(--nline); text-align: left; vertical-align: top; }
.tbl th { font-family: var(--f-mono); font-size: .7em; text-transform: uppercase; letter-spacing: .08em; color: var(--nmuted); font-weight: 500; background: var(--n2); }
.tbl td.n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.tbl tr.here td { background: color-mix(in srgb, var(--or) 22%, transparent); color: #fff; font-weight: 600; }
.tbl td.warn { color: var(--red); font-weight: 600; }
.pill { display: inline-block; font-family: var(--f-mono); font-size: .8em; padding: .15em .7em; border-radius: 99px; font-weight: 600; }
.pill.si { background: rgba(95,211,154,.18); color: var(--green); }
.pill.no { background: rgba(255,107,90,.18); color: var(--red); }
.pill.nd { background: rgba(242,138,46,.18); color: var(--or2); }
.calc-box { background: var(--n1); border: 1px solid var(--or); border-radius: 14px; padding: 1em 1.2em; font-family: var(--f-mono); display: grid; gap: .4em; }
.calc-box .res { font-family: var(--f-display); font-size: 3em; color: var(--or); line-height: 1; }
.alert { border: 2px solid var(--red); background: color-mix(in srgb, var(--red) 12%, var(--n1)); border-radius: 14px; padding: 1em 1.2em; display: grid; gap: .5em; }
.alert .t { font-family: var(--f-display); font-size: 1.7em; color: var(--red); font-weight: 700; }
.figure { display: grid; gap: .4em; }
.figure img { width: 100%; border-radius: 12px; display: block; border: 1px solid var(--nline); }
.ig-stage { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(320px, 26em); gap: 2.4em; align-items: center; }
.ig-stage .ig-wrap .instagram-media { max-width: 26em !important; }
.ig-box { background: #fff; border-radius: 14px; padding: .4em; max-height: 72vh; overflow: auto; }
.qr-box { background: #fff; border-radius: 14px; padding: 1em; display: grid; gap: .5em; justify-items: center; color: #13202B; }
.qr-box svg { width: 100%; max-width: 13em; height: auto; display: block; }
.qr-box .u { font-family: var(--f-mono); font-size: .7em; text-align: center; overflow-wrap: anywhere; }
.names { display: grid; grid-template-columns: repeat(5, 1fr); gap: .7em; }
.names div { border-top: 4px solid var(--c); background: var(--n1); border-radius: 0 0 10px 10px; padding: .6em .8em; }
.names div b { display: block; font-family: var(--f-display); font-size: 1.25em; color: #fff; line-height: 1.1; }
.names div span { font-size: .8em; color: var(--nmuted); }
/* preguntas */
.q-scene .num { font-family: var(--f-display); font-size: 1.4em; color: var(--or); }
.q-scene h2 { font-family: var(--f-body); font-weight: 600; font-size: 1.9em; line-height: 1.25; max-width: 40ch; }
.q-scene .opts { grid-template-columns: 1fr 1fr; gap: .6em; }
.q-scene .opt { background: var(--n1); border-color: var(--nline); color: var(--nink); cursor: default; padding: .7em .9em; min-height: 0; }
.q-scene .opt .k { background: var(--n2); border-color: var(--nline); width: 1.8em; height: 1.8em; }
.q-scene .opt.is-ok { background: rgba(95,211,154,.15); border-color: var(--green); }
.q-scene .opt.is-ok .k { background: var(--green); color: var(--n0); }
.timer { height: 8px; background: var(--n2); border-radius: 99px; overflow: hidden; }
.timer i { display: block; height: 100%; background: var(--or); width: 100%; transition: width 1s linear; }
.reveal { display: grid; gap: .4em; background: rgba(95,211,154,.12); border: 1px solid var(--green); border-radius: 12px; padding: .8em 1em; }
.reveal strong { font-family: var(--f-display); font-size: 1.4em; color: var(--green); }
.reveal .src { color: var(--nmuted); }
.bar { display: flex; align-items: center; gap: 10px; padding: 10px max(16px, 3vw) calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--nline); background: var(--n1); flex-wrap: wrap; }
.bar .btn { background: var(--n2); border-color: var(--nline); color: var(--nink); }
.bar .btn.primary { background: var(--or); border-color: var(--or); color: var(--n0); }
.bar .grow { flex: 1; }
.bar .pos { font-family: var(--f-mono); color: var(--nmuted); font-size: .9em; }
.bar .hint { font-size: .8em; color: var(--nmuted); }
.progress { height: 4px; background: var(--n2); }
.progress i { display: block; height: 100%; background: var(--bc, var(--or)); transition: width .3s; }
svg text { font-family: var(--f-body); }
@media (max-width: 900px) {
  .grid2, .grid3, .ig-stage, .q-scene .opts { grid-template-columns: 1fr; }
  .grid5, .names { grid-template-columns: 1fr 1fr; }
  .big-num div b { font-size: 4em; }
  .jump { display: none; }
}
@media (max-width: 420px) { .chips { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
</style>
</head>
<body>

<div id="movil" hidden></div>

<div id="proyector" hidden>
  <div>
    <div id="topbar"><span class="who"><span class="dot"></span><span id="who-name"></span></span><span class="blk" id="who-blk"></span><span class="grow"></span><nav class="jump" id="jump" aria-label="Ir a un bloque"></nav></div>
    <div class="progress"><i id="prog"></i></div>
  </div>
  <div id="stage" aria-live="polite"></div>
  <div class="bar">
    <button class="btn" id="p-prev" type="button">← Anterior</button>
    <button class="btn primary" id="p-next" type="button">Siguiente →</button>
    <button class="btn" id="p-reveal" type="button" hidden>Revelar respuesta (R)</button>
    <span class="pos" id="p-pos"></span>
    <span class="grow"></span>
    <span class="hint">← → para avanzar · R revela · 1 a 5 saltan al bloque</span>
    <button class="btn" id="p-full" type="button">Pantalla completa</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(function () {
  "use strict";
  var PUBLIC_URL = "https://pcpseguros-star.github.io/tp-aeronavegacion-spl9/";

    { ctx: "Austral vendió una promoción de luna de miel a Bariloche y operó los vuelos con sus propios aviones y su propia tripulación.",

      exp: "Es transporte pago de pasajeros con el avión siempre bajo control del asegurado. El uso Alquiler (que incluye el chárter) aplica cuando la operación NO está bajo control del asegurado, y acá Austral controlaba todo.",

    { ctx: "Los vuelos SPL eran especiales: sin itinerario ni horario fijo. La ruta fue Aeroparque – Bariloche.",

    { ctx: "Antes del vuelo, el asegurador tiene el formulario tipo de suscripción con los datos del comandante.",

        return '<div class="scene">' + head(sc, "2 · Las causas", "Qué dijo la <em>JIAAC</em>") +
          '<div class="grid2" style="grid-template-columns:1fr auto;align-items:center"><blockquote class="quote">«La causa del accidente puede atribuirse a un error de procedimiento de la tripulación durante la aproximación final por abandonar el procedimiento ILS, influenciada fuertemente (pero en forma indebida) por la interrupción de la señal VOR y también, probablemente, por el estado anímico del Comandante.»<small>Informe final · JIAAC, Disposición 129/78</small></blockquote>' +
          '<div class="qr-box" style="width:11em"><img src="' + IMG_QR_JIAAC + '" alt="QR al informe final de la JIAAC" style="width:100%;display:block"><span class="u" style="font-family:var(--f-body);font-weight:600;font-size:.75em">Escaneá y leé el informe final</span></div></div>' +
          '<div class="grid3"><div class="tile red"><span class="t">El factor humano</span><p>Conducta imprudente y competitiva del comandante: art. 4°, inc. 23 del Decreto 784/72.</p></div>' +
          '<div class="tile or"><span class="t">La falla en tierra</span><p>El VOR se cortó 2 minutos y la consola no tenía alarma. Pero el SPL-8 y el SPL-10 aterrizaron sin problemas.</p></div>' +
          '<div class="tile green"><span class="t">Lo que se descartó</span><p>El instrumental de a bordo y el ILS funcionaban bien. La meteorología no fue determinante.</p></div></div></div>';
      case "encuadre":
        return '<div class="scene">' + head(sc, "3 · Encuadre y suscripción", "¿Qué tipo de riesgo <em>era</em>?") +
          '<div class="grid5">' +
          '<div class="tile or"><span class="ic">💼</span><span class="t">Uso comercial</span><p>Transporte pago con tripulación propia, siempre bajo control de Austral. No es alquiler aunque la prensa dijera «chárter».</p></div>' +
          '<div class="tile"><span class="ic">📅</span><span class="t">No regular</span><p>Sin itinerario ni frecuencia fija: servicio especial de un transportador regular.</p></div>' +
          '<div class="tile"><span class="ic">🇦🇷</span><span class="t">Cabotaje</span><p>Aeroparque – Bariloche: rige el Código Aeronáutico (Ley 17.285), no Varsovia.</p></div>' +
          '<div class="tile"><span class="ic">🏷</span><span class="t">Matrícula LV</span><p>Aeronave privada. Austral era privada en 1977; la estatizaron en 1980.</p></div>' +
          '<div class="tile red"><span class="ic">✈</span><span class="t">En vuelo</span><p>Impactó en aproximación final: todavía no había aterrizado. Ni carreteo ni tierra.</p></div></div>' +
          '<p class="lead">Declarar un uso distinto del real agrava el riesgo y compromete la cobertura.</p></div>';
      case "formulario":
        return '<div class="scene">' + head(sc, "3 · Encuadre y suscripción", "El formulario que vería el <em>suscriptor</em>") +
          '<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Marca</th><th>Modelo</th><th>Año</th><th>Serie</th><th>Matrícula</th><th>Peso máx. despegue</th><th>Valor casco</th><th>Pax</th><th>Trip.</th></tr></thead>' +
          '<tbody><tr><td>BAC</td><td>111-420EL</td><td class="n">1968</td><td class="n">155</td><td class="n">LV-JGY</td><td class="n">~39.460 kg</td><td>Sin dato público</td><td class="n">74</td><td class="n">5</td></tr></tbody></table></div>' +
          '<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Función</th><th>Edad</th><th>Licencia</th><th>Horas totales</th><th>Horas en el tipo</th><th>Legajo</th></tr></thead>' +
          '<tbody><tr><td>Comandante</td><td class="n">39</td><td>Transporte de Línea Aérea</td><td class="n">11.918</td><td class="n">3.587:55</td><td class="warn">Sanciones previas ⚠</td></tr>' +
          '<tr><td>Copiloto</td><td class="n">s/d</td><td>Transporte de Línea Aérea</td><td class="n">12.347</td><td class="n">1.691:00</td><td>Sin observaciones</td></tr></tbody></table></div>' +
          '<div class="grid3"><div class="tile"><span class="t">Uso: Comercial</span></div><div class="tile"><span class="t">Base: Aeroparque</span></div><div class="tile"><span class="t">Límites: Argentina</span></div></div></div>';
      case "alerta":
        return '<div class="scene">' + head(sc, "3 · Encuadre y suscripción", "La señal que <em>nadie</em> miró") +
          '<div class="grid2"><div class="alert"><span class="t">⚠ Alerta de suscripción</span>' +
          '<div class="tl"><div class="r hot"><span class="h">08/05/1977</span><span class="m"></span><span>20 días de suspensión: sobrevoló a baja altura el aeropuerto de Paraná bajo mínimos (50 m de visibilidad) tras dos aterrizajes frustrados. <b>Dentro de los últimos 5 años.</b></span></div>' +
          '<div class="r"><span class="h">06/04/1963</span><span class="m"></span><span>6 meses de suspensión por volar en condiciones IFR sobre Uruguay sin autorización. Fuera del período de 5 años.</span></div></div></div>' +
          '<div style="display:grid;gap:.8em"><div class="tile red"><span class="t">El mismo patrón</span><p>Seis meses antes, en Paraná: insistir en aterrizar en condiciones adversas. Igual que en Bariloche.</p></div>' +
          '<div class="tile or"><span class="t">Qué podía hacer el asegurador</span><p>Pedir la declaración piloto por piloto y controles psicofísicos (lo que recomendó la JIAAC) para recargar la prima, poner franquicias o condicionar la cobertura.</p></div></div></div></div>';
      case "obligatorias":
        return '<div class="scene">' + head(sc, "4 · Coberturas obligatorias", "Código Aeronáutico: <em>3 de 4</em> se activaron") +
          '<div style="overflow-x:auto"><table class="tbl" style="font-size:1em"><thead><tr><th>Cobertura obligatoria (Ley 17.285)</th><th>¿Se activó?</th><th>Tope para el LV-JGY</th></tr></thead><tbody>' +
          '<tr><td>RC a pasajeros transportados (art. 144)</td><td><span class="pill si">Sí</span></td><td class="n">1.000 Ao por pasajero · 74.000 Ao</td></tr>' +
          '<tr><td>RC por equipajes y mercancías (art. 145)</td><td><span class="pill si">Sí</span></td><td class="n">2 Ao por kg despachado</td></tr>' +
          '<tr><td>Accidentes de la tripulación</td><td><span class="pill si">Sí</span></td><td>Fallecimiento de los 5 tripulantes</td></tr>' +
          '<tr><td>RC a terceros en superficie (art. 160)</td><td><span class="pill no">No</span></td><td class="n">34.730 Ao (cálculo teórico)</td></tr></tbody></table></div>' +
          '<p class="lead">Es el Título X del Código Aeronáutico: todo explotador aéreo debe tener estas cuatro coberturas vigentes.</p></div>';
      case "art160":
        var c = art160(39460);
        var rows = TRAMOS.map(function (t) {
          var f = t.x ? fmt(t.base) + " Ao + " + fmt(t.x) + " Ao/kg sobre " + fmt(t.desde) : fmt(t.base) + " Ao";
          return '<tr' + (t.n === 4 ? ' class="here"' : "") + '><td class="n">' + t.n + '</td><td>' + t.rango + '</td><td class="n">' + f + '</td></tr>';
        }).join("");
        return '<div class="scene">' + head(sc, "4 · Coberturas obligatorias", "Terceros en superficie: <em>no se usó</em>") +
          '<div class="grid2"><table class="tbl"><thead><tr><th>Tramo</th><th>Peso</th><th>Límite art. 160</th></tr></thead><tbody>' + rows + '</tbody></table>' +
          '<div style="display:grid;gap:.8em"><div class="calc-box"><span>39.460 − 20.000 = ' + fmt(c.exc) + ' kg</span><span>' + fmt(c.exc) + ' × 0,5 = ' + fmt(c.extra) + ' Ao</span><span>25.000 + ' + fmt(c.extra) + ' =</span><span class="res">' + fmt(c.total) + ' Ao</span></div>' +
          '<div class="tile green"><span class="t">¿Por qué no se activó?</span><p>Cayó en la ladera deshabitada del cerro: no hubo personas ni bienes dañados en tierra.</p></div>' +
          '<div class="tile"><span class="t">Contraste: LAPA 3142 (1999)</span><p>El avión salió de la pista e impactó vehículos en la Costanera: ahí sí hubo terceros en superficie.</p></div></div></div></div>';
      case "art144":
        return '<div class="scene">' + head(sc, "4 · Coberturas obligatorias", "Pasajeros, equipaje y <em>tripulación</em>") +
          '<div class="grid3">' +
          '<div class="tile or"><span class="kicker" style="color:var(--or2)">Art. 144 · por pasajero</span><span class="t" style="font-size:2.6em">1.000 Ao</span><p>41 fallecidos × 1.000 = 41.000 Ao<br>33 heridos: hasta 33.000 Ao, según la incapacidad de cada uno</p><p style="color:#fff;font-weight:600">Exposición máxima: 74.000 Ao</p></div>' +
          '<div class="tile"><span class="kicker" style="color:var(--sky)">Art. 145 · equipaje</span><span class="t" style="font-size:2.6em">2 Ao/kg</span><p>Peso bruto despachado × 2 Ao. Si el pasajero hizo declaración especial de valor y pagó la tasa, se paga lo declarado.</p><p>No hay registro público del peso total.</p></div>' +
          '<div class="tile"><span class="kicker" style="color:var(--green)">Tripulación · art. 191</span><span class="t" style="font-size:2.6em">5</span><p>Comandante, copiloto y tres auxiliares. Cubre a todo el personal a bordo, tenga o no relación de dependencia. Se pagan las prestaciones por muerte, y sepelio y traslado si estaban contratados.</p></div></div>' +
          '<p class="lead">La tripulación no es «pasajero»: pasajero es el tercero transportado que no cumple funciones a bordo.</p></div>';
      case "casco":
        return '<div class="bgimg" style="background-image:url(' + IMG_RESCATE + ');opacity:.28"></div><div class="scene">' + head(sc, "5 · Análisis y cierre", "Más allá de lo <em>obligatorio</em>") +
          '<div class="grid2"><div class="tile or"><span class="t">Casco · pérdida total</span><p>Impacto en vuelo con el 90% de la estructura destruida. Cláusula 10: se paga el valor al tiempo del siniestro, o sea valor a nuevo más mejoras, menos depreciación por uso, estado y antigüedad (9 años, 21.272 horas, 22.228 aterrizajes). Si el modelo ya no se fabrica, se toma el valor de mercado de uno equivalente.</p></div>' +
          '<div style="display:grid;gap:.7em"><div class="tile"><span class="t">Búsqueda y salvamento</span><p>La hicieron medios estatales (LV-MAW y patrullas). Con este adicional, el asegurador habría reembolsado los gastos hasta el sublímite.</p></div>' +
          '<div class="tile"><span class="t">Accidentes personales de pasajeros</span><p>Paga por el solo hecho del accidente y se suma a la RC del art. 144.</p></div>' +
          '<div class="tile"><span class="t">Gastos médicos y evacuación</span><p>Rescate en alta montaña, traslado y atención de los 33 sobrevivientes.</p></div></div></div>' +
          '<p class="credit">Fondo: recreación ilustrativa generada digitalmente, no es una fotografía del rescate.</p></div>';
      case "cumulo":
        return '<div class="scene">' + head(sc, "5 · Análisis y cierre", "Cúmulo y <em>quién responde</em>") +
          '<div class="grid2"><div style="display:grid;gap:.8em"><div class="tile red"><span class="t">Un riesgo catastrófico</span><p>Un solo evento: una aeronave destruida y 79 vidas afectadas bajo la misma póliza.</p></div>' +
          '<div class="tile or"><span class="t">Cúmulo operacional</span><p>Tres aviones del mismo asegurado, en la misma ruta, con minutos de diferencia y dependiendo del mismo VOR. La JIAAC recomendó evitar salidas tan cercanas.</p></div></div>' +
          '<div style="display:grid;gap:.6em">' +
          '<div class="tile"><span class="t">Austral, como transportador</span><p>Responde ante los 41 fallecidos, los 33 heridos y sus equipajes (arts. 144 y 145).</p></div>' +
          '<div class="tile"><span class="t">Austral, como empleador</span><p>Responde por los 5 tripulantes fallecidos en servicio.</p></div>' +
          '<div class="tile"><span class="t">El Estado, por el servicio de tránsito aéreo</span><p>VOR cortado y sin alarma: abre el debate sobre concurrencia de culpas y una subrogación parcial del asegurador.</p></div></div></div>' +
          '<p class="credit">No hay datos públicos sobre la aseguradora de Austral en 1977 ni sobre los montos pagados.</p></div>';
      case "culpa":
        return '<div class="scene">' + head(sc, "5 · Análisis y cierre", "Culpa grave: <em>dos preguntas</em> abiertas") +
          '<div class="grid2"><div class="tile or"><span class="kicker" style="color:var(--or2)">Art. 147 · Código Aeronáutico</span><span class="t">¿Austral pierde el tope de 1.000 Ao?</span><p>Solo si hay dolo. La temeridad del comandante suele invocarse para perforar el tope y pedir la reparación integral.</p></div>' +
          '<div class="tile red"><span class="kicker" style="color:var(--red)">Art. 70 · Ley de Seguros 17.418</span><span class="t">¿El asegurador se libera por culpa grave?</span><p>La culpa grave del piloto no alcanza frente a las víctimas. Pero Austral conocía la sanción de Paraná y aun así lo puso al mando: eso podría ser culpa grave propia.</p></div></div>' +
          '<div class="tile green"><span class="t">Conclusión</span><p>Se activaron 3 de las 4 coberturas obligatorias y hubo pérdida total del casco. Dos lecciones para el asegurador: leer el legajo piloto por piloto y controlar el cúmulo de vuelos simultáneos.</p></div></div>';
      case "juego":
        var qr = QR_SVG || qrMarkup(PUBLIC_URL);
        return '<div class="scene"><div class="grid2" style="grid-template-columns:1.4fr 1fr;align-items:center"><div style="display:grid;gap:1em">' +
          '<span class="kicker">Cierre · todo el grupo</span><h2 style="font-size:4em">Ahora <em>juegan ustedes</em></h2>' +
          '<p class="lead">Escaneen el código con el celular. Son 10 preguntas sobre lo que acabamos de exponer: respondan en el teléfono y después revelamos la respuesta en pantalla.</p>' +
          '<p class="lead">En el celular también está la calculadora de los arts. 144, 145 y 160.</p></div>' +
          '<div class="qr-box">' + (qr || '<p style="font-weight:600">Entrá desde el celular:</p>') + '<span class="u">' + esc(PUBLIC_URL.replace("https://", "")) + '</span></div></div></div>';
      case "q":
        var item = Q[sc.i];
        var opts = item.opts.map(function (o, k) {
          return '<div class="opt' + (pState.revealed && k === item.ok ? " is-ok" : "") + '"><span class="k">' + LETTERS[k] + '</span><span>' + esc(o) + '</span></div>';
        }).join("");
        return '<div class="scene q-scene"><span class="num">Pregunta ' + (sc.i + 1) + ' de ' + Q.length + '</span><p class="lead">' + esc(item.ctx) + '</p><h2>' + esc(item.q) + '</h2><div class="opts">' + opts + '</div>' +
          (pState.revealed ? '<div class="reveal"><strong>Respuesta ' + LETTERS[item.ok] + '</strong><p>' + esc(item.exp) + '</p><span class="src">' + esc(item.src) + '</span></div>' : '<div class="timer" aria-hidden="true"><i id="timer-bar"></i></div>') + '</div>';
      case "gracias":
        return '<div class="bgimg" style="background-image:url(' + IMG_AVION + ');opacity:.35"></div><div class="scene">' +
          '<h2 style="font-size:5em">¡<em>Gracias</em>!</h2><p class="lead">En memoria de las 46 personas que perdieron la vida en el vuelo SPL-9.</p>' +
          '<div class="names">' + P.map(function (x) { return '<div style="--c:' + x.c + '"><b>' + x.n + '</b></div>'; }).join("") + '</div>' +
          '<p class="credit">Fuentes: Apunte AERO 2026 y formulario tipo de suscripción (cátedra) · JIAAC, Informe final Disp. 129/78 · Infobae · ANBariloche · Aviation Safety Network · EASA TCDS BAC One-Eleven · Video: ' + IG_USER + ' (Instagram).</p></div>';
    }
    return "";
  }

  function renderProyector() {
    clearInterval(timerId);
    var sc = SCENES[pState.s];
    var p = sc.b === null ? null : P[sc.b];
    var color = p ? p.c : "var(--or)";
    document.getElementById("proyector").style.setProperty("--bc", color);
    document.getElementById("who-name").textContent = p ? p.n : (sc.id === "portada" ? "Presentación del grupo" : sc.id === "gracias" ? "Todo el grupo" : "Juego · todo el grupo");
    document.getElementById("who-blk").textContent = p ? "Bloque " + (sc.b + 1) + " de 5 · " + p.tema : "";
    document.getElementById("jump").innerHTML = P.map(function (x, k) {
      return '<button type="button" data-blk="' + k + '" style="--bc:' + x.c + '"' + (sc.b === k ? ' class="on"' : "") + '>' + (k + 1) + ' · ' + x.n.split(" ")[0] + '</button>';
    }).join("") + '<button type="button" data-blk="juego"' + (sc.id === "juego" || sc.id === "q" ? ' class="on"' : "") + ' style="--bc:var(--or)">Juego</button>';
    stage.innerHTML = sceneHTML(sc);
    document.getElementById("p-pos").textContent = (pState.s + 1) + " / " + SCENES.length;
    document.getElementById("prog").style.width = ((pState.s + 1) / SCENES.length * 100) + "%";
    document.getElementById("p-prev").disabled = pState.s === 0;
    document.getElementById("p-next").disabled = pState.s === SCENES.length - 1;
    document.getElementById("p-reveal").hidden = !(sc.id === "q" && !pState.revealed);
    if (sc.id === "video") igProcess();
    if (sc.id === "q" && !pState.revealed) {
      var left = 30, bar = document.getElementById("timer-bar");
      timerId = setInterval(function () { left -= 1; if (bar) bar.style.width = Math.max(0, left / 30 * 100) + "%"; if (left <= 0) clearInterval(timerId); }, 1000);
    }
  }
  function goTo(n) { if (n < 0 || n >= SCENES.length) return; pState.s = n; pState.revealed = false; renderProyector(); }
  function go(d) { goTo(pState.s + d); }
  function jumpBlock(k) {
    for (var i = 0; i < SCENES.length; i++) {
      if ((k === "juego" && SCENES[i].id === "juego") || SCENES[i].b === k) { goTo(i); return; }
    }
  }
  function reveal() { if (SCENES[pState.s].id !== "q" || pState.revealed) return; pState.revealed = true; renderProyector(); }
  document.getElementById("jump").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    var v = b.getAttribute("data-blk"); jumpBlock(v === "juego" ? "juego" : +v);
  });
  document.getElementById("p-prev").addEventListener("click", function () { go(-1); });
  document.getElementById("p-next").addEventListener("click", function () { go(1); });
  document.getElementById("p-reveal").addEventListener("click", reveal);
  document.getElementById("p-full").addEventListener("click", function () {
    var el = document.documentElement;
    try { if (document.fullscreenElement) document.exitFullscreen().catch(function () {}); else if (el.requestFullscreen) el.requestFullscreen().catch(function () {}); } catch (e) {}
  });
  document.addEventListener("keydown", function (e) {
    if (document.getElementById("proyector").hidden) return;
    if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); go(1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(-1); }
    else if (e.key === "r" || e.key === "R") reveal();
    else if (/^[1-5]$/.test(e.key)) jumpBlock(+e.key - 1);
  });

  function route() {
    var proj = location.hash === "#proyector";
    document.getElementById("proyector").hidden = !proj;
    mRoot.hidden = proj;
    if (proj) renderProyector(); else renderMovil();
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
